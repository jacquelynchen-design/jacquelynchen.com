<svg xmlns="http://www.w3.org/2000/svg" width="331" height="331" viewBox="0 0 331 331" role="img" aria-labelledby="title desc">
<title id="title">CaltexGo app icon — reconstructed vector</title>
<desc id="desc">Editable vector recreation from a 331 pixel raster reference. Circular O with concentric circular inner edge; other letter contours traced and smoothed; colours, gradients, logo geometry and shadows approximated. No embedded raster image.</desc>
<defs>
 <linearGradient id="tileGradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop stop-color="#f04421"/><stop offset="48%" stop-color="#b02216"/><stop offset="100%" stop-color="#700c16"/></linearGradient>
 <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".48"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="markShadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.2"/><feOffset dx="-2" dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="logoClip"><circle cx="203" cy="140.5" r="42.5"/></clipPath>
</defs>
<g id="app-tile"><rect x="32" y="22" width="267" height="266" rx="39" fill="url(#tileGradient)" filter="url(#tileShadow)"/></g>
<g id="go-mark" filter="url(#markShadow)">
